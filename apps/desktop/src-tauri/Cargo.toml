[package]
name = "veyra-desktop"
version = "0.1.0"
description = "Veyra Agent Platform desktop shell"
authors = ["Veyra"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "veyra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.4", features = [] }
tauri-plugin-shell = "=2.3.6"
