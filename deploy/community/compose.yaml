name: veyra-community

services:
  postgres:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-veyra_community}
      POSTGRES_USER: ${POSTGRES_USER:-veyra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/community/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    env_file: .env
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
      && mc mb --ignore-existing "local/$${MINIO_BUCKET}"
      && mc anonymous set private "local/$${MINIO_BUCKET}"

  community:
    build:
      context: ../..
      dockerfile: deploy/community/Dockerfile
    image: veyra-community:${VEYRA_BUILD_SHA:?set VEYRA_BUILD_SHA in deploy/community/.env}
    restart: unless-stopped
    env_file: .env
    environment:
      VEYRA_COMMUNITY_MODE: production
      VEYRA_COMMUNITY_HOST: 0.0.0.0
      VEYRA_COMMUNITY_PORT: 8000
      VEYRA_COMMUNITY_DATABASE_URL: ${VEYRA_COMMUNITY_DATABASE_URL:?set an encoded PostgreSQL URL in deploy/community/.env}
      VEYRA_COMMUNITY_OBJECT_STORAGE_BACKEND: s3
      VEYRA_COMMUNITY_S3_ENDPOINT_URL: http://minio:9000
      VEYRA_COMMUNITY_S3_BUCKET: ${MINIO_BUCKET:?set MINIO_BUCKET in deploy/community/.env}
      VEYRA_COMMUNITY_S3_REGION: ${VEYRA_COMMUNITY_S3_REGION:-us-east-1}
      VEYRA_COMMUNITY_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in deploy/community/.env}
      VEYRA_COMMUNITY_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in deploy/community/.env}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  caddy:
    image: caddy:2@sha256:13ba145cba2f3e28fa801994876e4c086d1b95d5aa2a520a734765ffb6b12017
    restart: unless-stopped
    env_file: .env
    depends_on:
      community:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
