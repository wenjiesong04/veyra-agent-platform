name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VEYRA_BUILD_SHA: ${{ github.sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements/runtime-py311.txt
            requirements/dev-py311.txt

      - name: Install locked backend dependencies
        run: |
          python -m pip install --require-hashes --requirement requirements/dev-py311.txt
          python -m pip install --no-deps --no-build-isolation --editable .

      - name: Verify dependency consistency
        run: make dependency-check dependency-lock-check PYTHON=python LOCKFILE=requirements/dev-py311.txt

      - name: Run formatting, lint, typing, and tests
        run: make check PYTHON=python

      - name: Validate local migrations from an empty database
        run: |
          database_dir="$(mktemp -d)"
          database_path="${database_dir}/local.sqlite3"
          VEYRA_LOCAL_DATABASE_URL="sqlite:///${database_path}" \
            python -m alembic -c backend/migrations/local/alembic.ini upgrade head

      - name: Validate Community migrations from an empty database
        run: |
          database_dir="$(mktemp -d)"
          database_path="${database_dir}/community.sqlite3"
          VEYRA_COMMUNITY_DATABASE_URL="sqlite:///${database_path}" \
            python -m alembic -c backend/migrations/community/alembic.ini upgrade head

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Run strict type checks
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test

      - name: Build Desktop and Community applications
        run: npm run build
